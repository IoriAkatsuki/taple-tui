name: "Bug Report / 反馈Bug"
description: "Create a report about the issues you encountered while using taple / 反馈你使用 taple 时遇到的问题"
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: |
        Check for existing issues
        检查是否已存在相同issue
      description: |
        Check the backlog of issues to reduce the chances of creating duplicates; if an issue already exists, place a +1 (👍) on it.
        检查现有的issue以避免创建重复的issue, 如果有已存在加个👍就OK了
      options:
        - label: Completed/已检查
          required: true
  - type: textarea
    attributes:
      label: |
        Describe the bug and provide steps to reproduce it
        描述遇到的bug并提供相应的复现方法
      description: |
        A clear and concise description of what the bug is.
        清楚简洁地描述遇到的bug
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      description: |
        Describe the OS, CPU Arch of your machine and the version of taple (`taple -V`). For historical v1.2.0 or earlier packages, use the original `taple-tui -V` command and report the exact version.
        描述你电脑的操作系统及CPU架构，以及 taple 的版本（`taple -V`）。v1.2.0 及以前的历史包请使用原命令 `taple-tui -V`，并注明准确版本。
    validations:
      required: true
  - type: textarea
    attributes:
      label: |
        If applicable, list the error messages you see
        如果有错误输出请一并填入
      description: |
        Input your error message
        输入你看到的错误信息
    validations:
      required: false
  - type: textarea
    attributes:
      label: |
        If applicable, attach relevant, redacted excerpts from `${TAPLE_ROOT}/log/taple.log`.
        如果 `${TAPLE_ROOT}/log/taple.log` 有相关错误，请上传已脱敏的摘录。
      description: |
        Use the log path printed by the application. With TAPLE_ROOT set, it is `${TAPLE_ROOT}/log/taple.log`. Otherwise use `${XDG_STATE_HOME}/go-musicfox/log/taple.log`, or `<home>/.local/state/go-musicfox/log/taple.log` when XDG_STATE_HOME is unset. Attach only relevant, redacted excerpts; never cookies, profiles or credentials.
        以程序打印的日志路径为准。设置 TAPLE_ROOT 时为 `${TAPLE_ROOT}/log/taple.log`；否则为 `${XDG_STATE_HOME}/go-musicfox/log/taple.log`，未设置 XDG_STATE_HOME 时为当前用户主目录下的 `.local/state/go-musicfox/log/taple.log`。只提供相关且已脱敏的摘录，不要上传 Cookie、浏览器 profile 或其他凭证。
    validations:
      required: false
