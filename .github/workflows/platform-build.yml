name: Native platform builds

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the binary and archive name
        required: true
        default: v1.2.0
        type: string

permissions:
  contents: read

concurrency:
  group: native-platform-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "1"
  GOTOOLCHAIN: local
  VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.2.0' }}

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            extension: ""
          - runner: windows-2022
            goos: windows
            goarch: amd64
            extension: .exe
          - runner: macos-15
            goos: darwin
            goarch: arm64
            extension: ""
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            extension: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.10"
          cache: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libvulkan-dev rpm cpio
      - name: Select sandbox-capable Linux browser
        if: runner.os == 'Linux'
        run: |
          # The runner's unpacked Chromium cannot use Ubuntu's AppArmor sandbox policy.
          # Installed Chrome has a supported sandbox; do not pass --no-sandbox.
          browser="$(command -v google-chrome)"
          test -x "$browser"
          printf 'TAPLE_BROWSER=%s\n' "$browser" >> "$GITHUB_ENV"
      - name: Confirm native macOS Metal SDK
        if: runner.os == 'macOS'
        run: |
          xcrun --find clang
          xcrun --show-sdk-path
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          cache: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-vulkan-headers
      - name: Expose native Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "$env:MSYS2_ROOT\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Confirm native CGO target
        env:
          EXPECT_OS: ${{ matrix.goos }}
          EXPECT_ARCH: ${{ matrix.goarch }}
        run: |
          test "$(go env GOOS)" = "$EXPECT_OS"
          test "$(go env GOARCH)" = "$EXPECT_ARCH"
          test "$(go env CGO_ENABLED)" = 1
          go version
      - name: Run all tests
        if: runner.os != 'Windows'
        env:
          TAPLE_GPU_DIAGNOSTICS_DIR: ${{ runner.temp }}/taple-gpu-evidence
        run: go test ./...
      - name: Test Windows from PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Windows tests failed." }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "Windows vet failed." }
      - name: Diagnose failed native Metal startup
        if: failure() && runner.os == 'macOS'
        timeout-minutes: 4
        env:
          TAPLE_GPU_DIAGNOSTICS_DIR: ${{ runner.temp }}/taple-gpu-evidence
          TAPLE_GPU_DIAGNOSTICS: "1"
        run: |
          system_profiler SPDisplaysDataType
          status=0
          go test -v ./internal/ui/deck/metalcompute ./internal/ui/deck \
            -run '^(TestMetalRoundTripAndClose|TestGPUWalkmanMatchesCPU)$' -count=1 -timeout=90s || status=$?
          go test -v ./internal/ui/deck -run '^TestMetalNormalizeDiagnostic$' -count=1 -timeout=90s || status=$?
          exit "$status"
      - name: Run concurrency regressions
        run: go test -race ./internal/applemusic ./internal/ui
      - name: Verify private Chrome pipe without login or music
        env:
          TAPLE_CHROME_SMOKE: "1"
          TAPLE_BROWSER_CAPABILITIES: "1"
        run: go test -v ./internal/applemusic -run '^TestChromePrivatePipeSmoke$' -count=1
      - name: Diagnose failed Linux browser runtime
        if: failure() && runner.os == 'Linux'
        timeout-minutes: 4
        env:
          TAPLE_CHROME_SMOKE: "1"
        run: |
          status=0
          go test -v ./internal/applemusic -run '^TestChromePrivatePipeSmoke$' -count=1 -timeout=60s || status=$?
          if command -v google-chrome >/dev/null; then
            TAPLE_BROWSER="$(command -v google-chrome)" TAPLE_BROWSER_CAPABILITIES=1 \
              go test -v ./internal/applemusic -run '^TestChromePrivatePipeSmoke$' -count=1 -timeout=60s || status=$?
          fi
          exit "$status"
      - name: Upload native rendering diagnostics
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gpu-diagnostics-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/taple-gpu-evidence
          if-no-files-found: ignore
          retention-days: 7
      - name: Check physical GPU parity or report unavailable hardware
        run: go test -v ./internal/ui/deck -run '^TestGPUWalkmanMatchesCPU$' -count=1

      - name: Build and install Linux or macOS binary
        if: runner.os != 'Windows'
        run: |
          GOBIN="$RUNNER_TEMP/taple-bin" hack/build.sh install
          "$RUNNER_TEMP/taple-bin/taple" --version
      - name: Build and install Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GOBIN = Join-Path $env:RUNNER_TEMP "taple-bin"
          ./hack/build.ps1 install
          if ($LASTEXITCODE -ne 0) { throw "Native build failed." }
          & (Join-Path $env:GOBIN "taple.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Installed binary failed." }
      - name: Package only the executable, readmes and license
        run: go run ./hack/package -version "$VERSION"
      - name: Package Linux DEB and RPM
        if: runner.os == 'Linux'
        run: hack/package-linux.sh "$VERSION"
      - name: Verify checksum and start the extracted binary
        env:
          RELEASE_OS: ${{ matrix.goos }}
          RELEASE_ARCH: ${{ matrix.goarch }}
          EXE_EXTENSION: ${{ matrix.extension }}
          TAPLE_ROOT: ${{ runner.temp }}/taple-cli-smoke
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            (cd dist && shasum -a 256 -c -- *.sha256)
          else
            (cd dist && sha256sum -c -- *.sha256)
          fi
          unpack="$RUNNER_TEMP/taple-unpack"
          mkdir -p "$unpack"
          if [[ "$RELEASE_OS" == windows ]]; then
            unzip -q dist/*.zip -d "$unpack"
          else
            tar -xzf dist/*.tar.gz -C "$unpack"
          fi
          binary="$unpack/taple_${VERSION}_${RELEASE_OS}_${RELEASE_ARCH}/taple$EXE_EXTENSION"
          actual="$("$binary" --version)"
          printf '%s\n' "$actual"
          [[ "$actual" == *"$VERSION"* ]]
      - name: Verify Windows archive without build-tool DLL paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path $env:RUNNER_TEMP "taple-unpack/taple_${env:VERSION}_windows_amd64/taple.exe"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw "Archive requires unavailable build-tool DLLs." }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: taple-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/taple_*
            dist/taple-*.rpm*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish verified release packages
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: taple-*
          merge-multiple: true
          path: dist
      - name: Publish archives and standalone Windows executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c -- *.sha256
          name="taple_${RELEASE_TAG}_windows_amd64"
          unzip -p "$name.zip" "$name/taple.exe" > "$name.exe"
          sha256sum "$name.exe" > "$name.exe.sha256"
          cat ./*.sha256 > SHA256SUMS
          # Draft first: a partial upload must never become a public release.
          notes=(--generate-notes)
          if [[ -f "../docs/releases/${RELEASE_TAG}.md" ]]; then
            notes=(--notes-file "../docs/releases/${RELEASE_TAG}.md")
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft "${notes[@]}" \
            --title "$RELEASE_TAG" ./*
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --prerelease --draft=false
          else
            gh release edit "$RELEASE_TAG" --draft=false
          fi
